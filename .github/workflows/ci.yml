name: CI

"on":
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  HUSKY: "0"

jobs:
  check:
    name: Lint, typecheck, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Deux commits : le contrôle de taille compare la référence à celle du parent
          # (pour une PR, le sommet de master ; pour un push, le commit précédent).
          fetch-depth: 2

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: "**/pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install && pnpm bootstrap

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: File size
        run: pnpm check:size --base HEAD^1

      - name: Build web
        run: pnpm --dir web build

      - name: Tests
        run: pnpm test

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: "**/pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install && pnpm bootstrap

      # The browser comes from Playwright's CDN and is cached; the system packages come from the
      # Ubuntu mirrors, whose DNS failed on the runner twice on 2026-11-11 (`--with-deps` then
      # aborted the job before any test). The runner image already ships Chrome and its
      # libraries, so a failed `install-deps` only warns: a really missing library still fails
      # the tests, with a clear error.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: pnpm --dir web exec playwright install chromium

      # A hung apt-get must not hold the job: past 8 minutes the runner kills the step's whole
      # process tree (sudo children included) and the job carries on with the runner image.
      - name: Install Playwright system dependencies
        timeout-minutes: 8
        continue-on-error: true
        run: |
          for attempt in 1 2 3; do
            pnpm --dir web exec playwright install-deps chromium && exit 0
            echo "install-deps failed (attempt $attempt), retrying in 20 s"
            sleep 20
          done
          echo "::warning::Playwright system dependencies not installed; relying on the runner image"

      - name: Run end-to-end tests
        run: pnpm e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: web/test-results/
          if-no-files-found: ignore
